
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WA CRM — Manikandan Consultancy</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0f1117;
  --bg2: #161b27;
  --bg3: #1e2535;
  --bg4: #252d40;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #eef0f6;
  --text2: #8b92a8;
  --text3: #555e78;
  --accent: #25d366;
  --accent2: #1da851;
  --blue: #4f8ef7;
  --blue2: #1a3a6e;
  --amber: #f7a325;
  --amber2: #6b420a;
  --red: #f75454;
  --red2: #6b1a1a;
  --teal: #25cdd4;
  --teal2: #0d4a4d;
  --purple: #a78bfa;
  --purple2: #3b2a6e;
  --green: #4ade80;
  --green2: #14532d;
  --sidebar-w: 220px;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }

/* Layout */
.app { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
  transition: transform .3s;
}
.logo { padding: 22px 20px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
.logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 16px; flex-shrink: 0; }
.logo-text { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.2; }
.logo-sub { font-size: 10px; color: var(--text3); font-weight: 400; font-family: 'DM Sans', sans-serif; }
.nav-section { padding: 18px 20px 6px; font-size: 10px; color: var(--text3); letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 20px;
  font-size: 13.5px; color: var(--text2); cursor: pointer; border-left: 3px solid transparent;
  transition: all .18s; position: relative;
}
.nav-item:hover { color: var(--text); background: var(--bg3); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(37,211,102,0.06); }
.nav-item .nav-icon { width: 18px; text-align: center; font-size: 14px; }
.nav-badge { margin-left: auto; background: var(--accent); color: #000; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 20px; }
.sidebar-footer { margin-top: auto; padding: 16px 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text3); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.topbar {
  padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px;
  background: var(--bg2); flex-shrink: 0;
}
.page-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text); flex: 1; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; min-width: 180px; }
.search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; width: 100%; }
.search-box input::placeholder { color: var(--text3); }
.search-box i { color: var(--text3); font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--bg3); color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all .18s; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--bg4); border-color: var(--border2); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
.btn-accent:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-wa { background: #128C7E; border-color: #128C7E; color: #fff; }
.btn-wa:hover { background: #0a6b60; border-color: #0a6b60; }
.hamburger { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 4px; }

/* Content */
.content { flex: 1; overflow-y: auto; padding: 22px 24px; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; position: relative; overflow: hidden; transition: border-color .2s;
}
.stat-card:hover { border-color: var(--border2); }
.stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 2px 2px 0 0; }
.stat-card.s-green::before { background: var(--accent); }
.stat-card.s-blue::before { background: var(--blue); }
.stat-card.s-amber::before { background: var(--amber); }
.stat-card.s-teal::before { background: var(--teal); }
.stat-card.s-red::before { background: var(--red); }
.stat-icon { font-size: 22px; margin-bottom: 10px; }
.stat-card.s-green .stat-icon { color: var(--accent); }
.stat-card.s-blue .stat-icon { color: var(--blue); }
.stat-card.s-amber .stat-icon { color: var(--amber); }
.stat-card.s-teal .stat-icon { color: var(--teal); }
.stat-card.s-red .stat-icon { color: var(--red); }
.stat-num { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--text2); margin-top: 4px; }

/* Filter bar */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.fchip { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 12px; cursor: pointer; transition: all .15s; font-family: 'DM Sans', sans-serif; }
.fchip:hover { border-color: var(--border2); color: var(--text); }
.fchip.active { background: rgba(37,211,102,0.12); border-color: var(--accent); color: var(--accent); }

/* Table */
.table-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
thead { background: var(--bg3); }
th { padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
td { padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.02); }
td.strong { color: var(--text); font-weight: 500; }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.b-new { background: rgba(79,142,247,0.15); color: var(--blue); }
.b-contacted { background: rgba(247,163,37,0.15); color: var(--amber); }
.b-interested { background: rgba(37,211,102,0.15); color: var(--accent); }
.b-placed { background: rgba(37,205,212,0.15); color: var(--teal); }
.b-rejected { background: rgba(247,84,84,0.15); color: var(--red); }
.b-hot { background: rgba(247,84,84,0.15); color: var(--red); }
.b-warm { background: rgba(247,163,37,0.15); color: var(--amber); }
.b-cold { background: rgba(79,142,247,0.15); color: var(--blue); }
.b-active { background: rgba(37,211,102,0.15); color: var(--accent); }
.b-hold { background: rgba(247,163,37,0.15); color: var(--amber); }
.b-closed { background: rgba(247,84,84,0.15); color: var(--red); }
.b-high { background: rgba(247,84,84,0.15); color: var(--red); }
.b-normal { background: rgba(37,211,102,0.12); color: var(--accent); }

/* Avatar */
.avatar { width: 32px; height: 32px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--bg4); color: var(--text2); flex-shrink: 0; font-family: 'Syne', sans-serif; }

/* WA icon btn */
.wa-icon { background: none; border: none; color: #25d366; font-size: 18px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .15s; }
.wa-icon:hover { background: rgba(37,211,102,0.1); }

/* Panel (drawer) */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; }
.overlay.open { display: block; }
.drawer {
  position: fixed; top: 0; right: -420px; width: 420px; max-width: 100vw; height: 100vh;
  background: var(--bg2); border-left: 1px solid var(--border); z-index: 101;
  display: flex; flex-direction: column; transition: right .28s cubic-bezier(.4,0,.2,1);
  box-shadow: var(--shadow);
}
.drawer.open { right: 0; }
.drawer-head { padding: 20px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.drawer-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
.drawer-body { flex: 1; overflow-y: auto; padding: 22px; }
.drawer-foot { padding: 16px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-shrink: 0; }

/* Forms */
.form-section { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .8px; text-transform: uppercase; margin: 18px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.form-section:first-child { margin-top: 0; }
.fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.fg label { font-size: 12px; color: var(--text2); font-weight: 500; }
.fg input, .fg select, .fg textarea {
  background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 13px; font-family: 'DM Sans', sans-serif;
  padding: 9px 12px; outline: none; transition: border-color .15s; width: 100%;
}
.fg input:focus, .fg select:focus, .fg textarea:focus { border-color: var(--accent); }
.fg input::placeholder, .fg textarea::placeholder { color: var(--text3); }
.fg select option { background: var(--bg3); }
.fg textarea { resize: vertical; min-height: 64px; line-height: 1.5; }
.fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.source-pill { display: inline-flex; align-items: center; gap: 6px; background: rgba(79,142,247,0.12); color: var(--blue); border: 1px solid rgba(79,142,247,0.25); border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; margin-bottom: 14px; }

/* Detail panel */
.detail-hero { background: var(--bg3); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; display: flex; align-items: flex-start; gap: 14px; }
.detail-avatar { width: 46px; height: 46px; border-radius: 12px; background: var(--bg4); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text2); flex-shrink: 0; }
.detail-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); }
.detail-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
.detail-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-key { color: var(--text3); font-size: 12px; }
.detail-val { color: var(--text); text-align: right; max-width: 60%; }
.skills-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.skill-tag { background: var(--bg4); color: var(--text2); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 500; }
.note-block { background: var(--bg3); border-radius: var(--radius-sm); padding: 12px; font-size: 13px; color: var(--text2); line-height: 1.6; margin-top: 4px; border-left: 3px solid var(--accent); }

/* Dashboard cards */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.dash-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.dash-card-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }
.dash-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); margin-bottom: 4px; background: var(--bg3); transition: background .15s; }
.dash-row:hover { background: var(--bg4); }
.dash-row-name { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
.dash-row-sub { font-size: 11px; color: var(--text3); }

/* Pipeline funnel */
.pipeline { display: flex; gap: 6px; margin-bottom: 20px; }
.pipe-stage { flex: 1; background: var(--bg3); border-radius: var(--radius-sm); padding: 10px 12px; text-align: center; border: 1px solid var(--border); }
.pipe-num { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
.pipe-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--bg4); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  padding: 10px 20px; font-size: 13px; color: var(--text); z-index: 999;
  display: flex; align-items: center; gap: 8px;
  transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
  opacity: 0; pointer-events: none; white-space: nowrap;
  box-shadow: var(--shadow);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast i { color: var(--accent); }

/* Empty */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty i { font-size: 36px; margin-bottom: 10px; display: block; }
.empty p { font-size: 13px; }

/* Edit & Delete buttons */
.edit-btn { background: none; border: none; color: var(--text3); font-size: 13px; cursor: pointer; padding: 4px 7px; border-radius: 6px; transition: all .15s; }
.edit-btn:hover { background: rgba(79,142,247,0.12); color: var(--blue); }
.del-btn { background: none; border: none; color: var(--text3); font-size: 13px; cursor: pointer; padding: 4px 7px; border-radius: 6px; transition: all .15s; }
.del-btn:hover { background: rgba(247,84,84,0.12); color: var(--red); }

/* Responsive */
@media (max-width: 768px) {
  .sidebar { position: fixed; top: 0; left: 0; height: 100vh; z-index: 200; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .mob-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 199; }
  .mob-overlay.open { display: block; }
  .hamburger { display: block; }
  .search-box { display: none; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .pipeline { flex-wrap: wrap; }
  .pipe-stage { min-width: calc(50% - 3px); }
  .drawer { width: 100vw; }
  .content { padding: 16px; }
  .fg2 { grid-template-columns: 1fr; }
}
@media (max-width: 400px) {
  .stats-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<div class="mob-overlay" id="mob-overlay" onclick="closeSidebar()"></div>

<div class="app">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon"><i class="fab fa-whatsapp"></i></div>
      <div>
        <div class="logo-text">WA CRM</div>
        <div class="logo-sub">Manikandan Consultancy</div>
      </div>
    </div>

      <div style="margin-bottom:4px;color:var(--text2);font-weight:500">Data saved in browser</div>
      <div style="color:var(--text3)">Export backup regularly</div>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <button class="hamburger" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
      <div class="page-title" id="page-title">Dashboard</div>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search..." oninput="handleSearch()">
      </div>
      <button class="btn btn-accent" id="add-btn" onclick="openAddDrawer()">
        <i class="fas fa-plus"></i> <span id="add-label">Add</span>
      </button>
    </div>
    <div class="content" id="content-area"></div>
  </div>
</div>

<!-- Overlay + Drawer -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title" id="drawer-title">New Record</div>
    <button class="btn btn-sm" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toast-msg"></span></div>

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function loadOrEmpty(key) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : []; } catch { return []; }
}

// On very first open ever: seed with sample data so UI isn't blank
// After that: always use whatever is in localStorage (including empty after clear)
const FIRST_RUN_KEY = 'wcrm_initialized';
const isFirstRun = !localStorage.getItem(FIRST_RUN_KEY);

let candidates, clients, jobs, followups;

if (isFirstRun) {
  // First time opening this app on this browser/domain — load seed data
  candidates = SEED_CANDIDATES;
  clients    = SEED_CLIENTS;
  jobs       = SEED_JOBS;
  followups  = SEED_FU;

  save(FIRST_RUN_KEY,     '1');
} else {
  // Not first run — always load from localStorage (import restored data or user's real data)
  candidates = loadOrEmpty('wcrm_candidates');

  jobs       = loadOrEmpty('wcrm_jobs');

}

// ── Nav badges ───────────────────────────────────────────────────
function updateBadges() {
  document.getElementById('nb-cand').textContent = candidates.length;
  document.getElementById('nb-client').textContent = clients.length;
  document.getElementById('nb-jobs').textContent = jobs.length;
  const todayFu = followups.filter(f=>f.due==='Today').length;

  document.getElementById('nb-fu').style.display = todayFu ? 'inline-block' : 'none';

// ── Routing ──────────────────────────────────────────────────────
function switchView(v, el) {
  currentView = v; searchTerm = '';
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = {dashboard:'Dashboard',candidates:'Candidates',clients:'Clients',jobs:'Job Orders',followups:'Follow-ups'};
  const labels = {dashboard:'',candidates:'Add candidate',clients:'Add client',jobs:'Add job',followups:'Add follow-up'};
  document.getElementById('page-title').textContent = titles[v];
  document.getElementById('add-label').textContent = labels[v] || 'Add';
  document.getElementById('add-btn').style.display = v==='dashboard' ? 'none' : 'inline-flex';
  closeSidebar();
  render();
}

function render() {
  updateBadges();
  const el = document.getElementById('content-area');
  if (currentView==='dashboard') el.innerHTML = renderDashboard();
  else if (currentView==='candidates') el.innerHTML = renderCandidates();
  else if (currentView==='clients') el.innerHTML = renderClients();
  else if (currentView==='jobs') el.innerHTML = renderJobs();
  else if (currentView==='followups') el.innerHTML = renderFollowups();
}

// ── Helpers ──────────────────────────────────────────────────────
function waLink(phone, name) {
  return 'https://wa.me/91'+phone+'?text='+encodeURIComponent('Hi '+name+', this is Manikandan calling from the consultancy.');
}
function fmtDate(d) {
  if (!d || d==='Today'||d==='Tomorrow') return d;
  try { return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); } catch { return d; }
}
function initials(n) { return n.split(' ').map(x=>x[0]||'').join('').toUpperCase().slice(0,2); }
function badgeCand(s) { const m={New:'b-new',Contacted:'b-contacted',Interested:'b-interested',Placed:'b-placed',Rejected:'b-rejected'}; return m[s]||'b-new'; }
function badgeClient(s) { return {Hot:'b-hot',Warm:'b-warm',Cold:'b-cold'}[s]||'b-cold'; }
function badgeJob(s) { return {Active:'b-active','On Hold':'b-hold',Closed:'b-closed'}[s]||'b-hold'; }
function srcIcon(s) { return {LinkedIn:'fab fa-linkedin',Naukri:'fas fa-file-alt',Referral:'fas fa-user-friends',WhatsApp:'fab fa-whatsapp',Other:'fas fa-ellipsis-h'}[s]||'fas fa-ellipsis-h'; }

function showToast(msg) {
  document.getElementById('toast-msg').textContent = msg;
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

function editCandidate(id) {
  const c = candidates.find(x=>x.id===id); if(!c) return;

}
function updateSrcPill() {
  const s = document.getElementById('c-source').value;
  document.getElementById('src-pill-text').textContent = s;
  document.querySelector('#src-pill i').className = srcIcon(s);
}
function saveCandidate() {
  const name=v('c-name'), phone=v('c-phone'), role=v('c-role'), exp=v('c-exp');
  if(!name||!phone||!role||!exp){showToast('Please fill all required fields'); return;}
  const skillsRaw=v('c-skills');
  const record = {name,phone,role,exp,ctc:v('c-ctc')||'—',ectc:v('c-ectc')||'—',avail:v('c-avail'),status:v('c-status'),skills:skillsRaw?skillsRaw.split(',').map(s=>s.trim()).filter(Boolean):[],note:v('c-note'),source:v('c-source'),location:v('c-loc'),email:v('c-email')};
  if (editCandId) {
    const idx = candidates.findIndex(x=>x.id===editCandId);
    if(idx>-1) candidates[idx] = {...candidates[idx],...record};
    showToast(name+' updated ✓');
  } else {
    candidates.push({id:nextId.c++,...record});
    showToast(name+' added to candidates ✓');

  editCandId=null; save('wcrm_candidates',candidates); closeDrawer(); render();
}

// ── Add / Edit Client ────────────────────────────────────────────

function editClient(id) {

function saveClient() {

// ── Add / Edit Job ───────────────────────────────────────────────

// ── Add Follow-up ────────────────────────────────────────────────
function openAddFollowup(prefillName,prefillPhone,prefillType) {
  const allPeople = [
    ...candidates.map(c=>({label:c.name+' (Candidate)',val:c.name,phone:c.phone,type:'Candidate'})),
    ...clients.map(c=>({label:c.name+' (Client)',val:c.name,phone:c.phone,type:'Client'}))
  ];
  openDrawer('New Follow-up', `
    <div class="fg2">
      <div class="fg"><label>Type</label>
        <select id="fu-type" onchange="onFuType()">
          <option value="Candidate"${prefillType==='Candidate'?' selected':''}>Candidate</option>
          <option value="Client"${prefillType==='Client'?' selected':''}>Client</option>
        </select>
      </div>
      <div class="fg"><label>Priority</label>
        <select id="fu-priority"><option>Normal</option><option>High</option></select>
      </div>
    </div>
    <div class="fg"><label>Name *</label>
      <select id="fu-name" onchange="onFuName()">
        <option value="">— select —</option>
        ${allPeople.map(p=>`<option value="${p.val}" data-phone="${p.phone}" data-type="${p.type}"${p.val===prefillName?' selected':''}>${p.label}</option>`).join('')}
      </select>
    </div>
    <div class="fg"><label>Phone *</label><input type="tel" id="fu-phone" placeholder="98XXXXXXXX" value="${prefillPhone||''}"></div>
    <div class="fg"><label>Action needed *</label><textarea id="fu-action" placeholder="e.g. Send JD for Java Developer role, check notice period..."></textarea></div>
    <div class="fg2">
      <div class="fg"><label>Due</label>
        <select id="fu-due" onchange="onFuDue()">
          <option value="Today">Today</option>
          <option value="Tomorrow">Tomorrow</option>
          <option value="custom">Pick a date...</option>
        </select>
      </div>
      <div class="fg" id="fu-date-wrap" style="display:none"><label>Date</label><input type="date" id="fu-date"></div>
    </div>
  `, `<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn btn-accent" onclick="saveFollowup()"><i class="fas fa-save"></i> Save follow-up</button>`);
}
function onFuType() {
  const t=v('fu-type');
  const allPeople=[...candidates.map(c=>({label:c.name,val:c.name,phone:c.phone,type:'Candidate'})),...clients.map(c=>({label:c.name,val:c.name,phone:c.phone,type:'Client'}))];
  const sel=document.getElementById('fu-name');
  sel.innerHTML='<option value="">— select —</option>'+allPeople.filter(p=>p.type===t).map(p=>`<option value="${p.val}" data-phone="${p.phone}">${p.label}</option>`).join('');
  document.getElementById('fu-phone').value='';
}
function onFuName() {
  const sel=document.getElementById('fu-name');
  const opt=sel.options[sel.selectedIndex];
  if(opt&&opt.dataset.phone) document.getElementById('fu-phone').value=opt.dataset.phone;
}
function onFuDue() {
  document.getElementById('fu-date-wrap').style.display=v('fu-due')==='custom'?'flex':'none';
}
function saveFollowup() {
  const name=v('fu-name'),phone=v('fu-phone'),action=v('fu-action'),dueVal=v('fu-due');
  if(!name||!phone||!action){showToast('Please fill all required fields'); return;}
  let due=dueVal;
  if(dueVal==='custom'){const d=v('fu-date');if(!d){showToast('Please pick a date');return;}due=d;}
  followups.push({id:nextId.f++,type:v('fu-type'),name,action,due,phone,priority:v('fu-priority')});
  save('wcrm_followups',followups); closeDrawer(); render(); showToast('Follow-up added ✓');
}

// ── Delete functions ─────────────────────────────────────────────
function deleteCandidate(id) {
  const c = candidates.find(x=>x.id===id); if(!c) return;
  if (!confirm('Delete candidate "' + c.name + '"? This cannot be undone.')) return;
  candidates = candidates.filter(x=>x.id!==id);
  save('wcrm_candidates', candidates); closeDrawer(); render(); showToast(c.name + ' deleted');
}
function deleteClient(id) {
  const c = clients.find(x=>x.id===id); if(!c) return;
  if (!confirm('Delete client "' + c.name + '"? This cannot be undone.')) return;
  clients = clients.filter(x=>x.id!==id);
  save('wcrm_clients', clients); closeDrawer(); render(); showToast(c.name + ' deleted');
}
function deleteJob(id) {
  const j = jobs.find(x=>x.id===id); if(!j) return;
  if (!confirm('Delete job order "' + j.role + ' @ ' + j.client + '"? This cannot be undone.')) return;
  jobs = jobs.filter(x=>x.id!==id);
  save('wcrm_jobs', jobs); render(); showToast('Job order deleted');
}
function clearAllData() {
  if (!confirm('⚠️ This will DELETE ALL candidates, clients, jobs and follow-ups.\n\nAre you absolutely sure? Export a backup first if needed.')) return;
  if (!confirm('Last chance — click OK to permanently clear everything.')) return;
  candidates=[]; clients=[]; jobs=[]; followups=[];
  nextId={c:1,cl:1,j:1,f:1};
  // Save empty arrays (don't remove keys — removing would trigger first-run seed on next open)
  save('wcrm_candidates',[]); save('wcrm_clients',[]); save('wcrm_jobs',[]); save('wcrm_followups',[]);
  save(FIRST_RUN_KEY,'1'); // keep initialized flag so seed never runs again
  closeDrawer(); closeSidebar(); render(); showToast('All data cleared');
}

// ── Export / Import ──────────────────────────────────────────────
function exportData() {
  const payload = {
    version: 1,
    exported: new Date().toISOString(),
    candidates, clients, jobs, followups
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'wcrm-backup-' + date + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Backup downloaded ✓');
  closeSidebar();
}

function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.candidates || !d.clients || !d.jobs || !d.followups) { showToast('Invalid backup file'); return; }
      if (!confirm('This will REPLACE all current data with the backup. Are you sure?')) return;
      candidates = d.candidates; clients = d.clients; jobs = d.jobs; followups = d.followups;
      nextId.c  = Math.max(0,...(candidates.length?candidates.map(x=>x.id):[0]))+1;
      nextId.cl = Math.max(0,...(clients.length?clients.map(x=>x.id):[0]))+1;
      nextId.j  = Math.max(0,...(jobs.length?jobs.map(x=>x.id):[0]))+1;
      nextId.f  = Math.max(0,...(followups.length?followups.map(x=>x.id):[0]))+1;
      save('wcrm_candidates',candidates); save('wcrm_clients',clients);
      save('wcrm_jobs',jobs); save('wcrm_followups',followups);
      save(FIRST_RUN_KEY, '1'); // mark initialized so seed data never overwrites again
      render(); showToast('Backup restored ✓ — ' + candidates.length + ' candidates, ' + clients.length + ' clients');
    } catch { showToast('Could not read file. Make sure it is a valid backup.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ── Utility ──────────────────────────────────────────────────────
function v(id) { const el=document.getElementById(id); return el?el.value.trim():''; }

// ── Init ─────────────────────────────────────────────────────────
document.getElementById('add-btn').style.display = 'none';
render();
</script>
